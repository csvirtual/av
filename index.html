<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Carliane Silva | C&S Assistência Virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            background: linear-gradient(135deg, #6a0dad, #b19cd9);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .bio-container {
            text-align: center;

            padding: 20px;

        }
        .profile-pic {
            width: 175px;
            height: auto;
            border-radius: 50%;

            border: 4px solid #6a0dad;
        }
        .bio-name {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 10px;
        }
        .bio-desc {
            font-size: 1em;
            color: #555;
            margin-bottom: 15px;
        }
        .bio-links a {
            display: block;
            padding: 10px;
            margin: 5px 0;
            background: #6a0dad;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
        }
        .bio-links a:hover {
            background: #b19cd9;
        }
        .social-icons a {
            margin: 10px;
            color: #6a0dad;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div class="bio-container">
