<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDV - C&amp;S Virtual / MT</title>
<!-- PWA: instalável em celular/tablet ("Adicionar à tela inicial") e em
     PC (Chrome/Edge oferecem "Instalar app") — mesmo site, só ganha o
     invólucro de app. Ícones reaproveitam o mesmo desenho (verde +
     código de barras) já usado no ícone da extensão irmã, gerados em
     resolução maior (só existia até 128px lá — ver public/icons/). -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#145333">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PDV C&amp;S">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!--
    Fase 9 (interface real) — Estoque e PDV portados de verdade, servidos
    por este HTML em vez de public/test.html. Ver public/js/app.js pro
    porquê desta casca ser mínima (só 2 rotas, sem menu lateral completo
    ainda) e README.md pro roteiro completo.
  -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="root">
    <div class="boot-loading">Carregando…</div>
  </div>
  <!-- Botão "voltar ao topo": fora de #root de propósito, então sobrevive
       a QUALQUER root.innerHTML ser reescrito (login, tela de aba
       bloqueada, app normal, troca de rota...) — funciona em qualquer
       página que role, não só dentro do app já logado. Ver js/app.js pela
       ligação com o scroll (feita uma única vez, fora de renderShell) e
       css/styles.css pelo estilo (mesmo CSS da extensão, só faltava isto
       aqui + o JS). -->
  <button class="scroll-top-btn" id="scroll-top-btn" type="button" tabindex="-1" aria-label="Voltar ao topo" title="Voltar ao topo">
    <svg viewBox="0 0 20 20" width="20" height="20" fill="none" aria-hidden="true" focusable="false">
      <path d="M10 14.5V5.5M10 5.5L5 10.5M10 5.5L15 10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <script type="module" src="js/app.js"></script>
</body>
</html>
