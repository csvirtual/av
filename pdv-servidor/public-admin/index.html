<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDV - C&amp;S Virtual — Painel da Plataforma</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
  <!--
    Etapa 8 do roteiro multi-tenant (ver artifact "PDV Multi-Tenant"):
    painel mínimo de Super Admin — login (control/plataforma.sqlite3 #
    platform_admins) + listar lojas + mudar status/vencimento
    (control/db.js#setTenantStatus, mesma função que a CLI
    scripts/createTenant.js --set-status usa). Sem contrapartida na
    extensão (pdv-extension) — tela nova, de propósito fora da regra de
    paridade visual documentada em CLAUDE.md (que vale só pra telas que
    existem nos dois produtos).
  -->
  <div id="toast-root" aria-live="polite"></div>

  <div id="login-screen" class="screen">
    <form id="login-form" class="login-card">
      <h1>Painel da plataforma</h1>
      <p class="subtitle">PDV - C&amp;S Virtual — administração das lojas</p>
      <label for="login-username">Usuário</label>
      <input id="login-username" name="username" type="text" autocomplete="username" required>
      <label for="login-password">Senha</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app-screen" class="screen" hidden>
    <header>
      <h1>Lojas</h1>
      <div class="header-actions">
        <span id="admin-username"></span>
        <button id="logout-btn" type="button" class="ghost">Sair</button>
      </div>
    </header>
    <main>
      <table id="tenants-table">
        <thead>
          <tr>
            <th>Loja</th>
            <th>Slug</th>
            <th>CNPJ</th>
            <th>Status</th>
            <th>Vencimento</th>
            <th>Criada em</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tenants-body"></tbody>
      </table>
      <p id="empty-state" hidden>Nenhuma loja cadastrada ainda.</p>
    </main>
  </div>

  <template id="tenant-row-template">
    <tr>
      <td class="tenant-name"></td>
      <td class="tenant-slug"></td>
      <td class="tenant-cnpj"></td>
      <td>
        <select class="tenant-status"></select>
      </td>
      <td>
        <input type="date" class="tenant-expires">
      </td>
      <td class="tenant-created"></td>
      <td><button type="button" class="save-btn">Salvar</button></td>
    </tr>
  </template>

  <script src="admin.js"></script>
</body>
</html>
