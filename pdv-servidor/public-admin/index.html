<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDV - C&amp;S Virtual: Painel de Controle</title>
<script>
  // Aplica o tema salvo ANTES do CSS renderizar, pra não piscar no tema
  // errado por uma fração de segundo (mesma chave "theme.preference" de
  // public/js/theme.js — cada origem tem seu próprio localStorage, então
  // isso não "puxa" a preferência de outra tela, só reaproveita o nome
  // pra quem já conhece o padrão do resto do PDV).
  (function () {
    try {
      var v = localStorage.getItem('theme.preference');
      if (v === 'dark' || v === 'light') document.documentElement.setAttribute('data-theme', v);
    } catch {}
  })();
</script>
<link rel="stylesheet" href="admin.css">
</head>
<body>
  <!--
    Etapa 8 do roteiro multi-tenant (ver artifact "PDV Multi-Tenant"):
    painel mínimo de Super Admin — login (control/plataforma.sqlite3 #
    platform_admins) + listar lojas + mudar status/vencimento
    (control/db.js#setTenantStatus, mesma função que a CLI
    scripts/createTenant.js --set-status usa). Sem contrapartida na
    extensão (pdv-extension) — tela nova, de propósito fora da regra de
    paridade visual documentada em CLAUDE.md (que vale só pra telas que
    existem nos dois produtos).
  -->
  <div id="toast-root" aria-live="polite"></div>

  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema claro/escuro"></button>

  <div id="login-screen" class="screen">
    <main class="auth-screen">
      <form id="login-form" class="auth-card">
        <div class="auth-brand">
          <span class="dot" aria-hidden="true"></span>
          <span>PDV - C&amp;S Virtual (multi-terminal)</span>
        </div>
        <h1>Painel de Controle</h1>
        <p class="subtitle">Administre as lojas cadastradas.</p>
        <div class="field">
          <label for="login-username">Usuário</label>
          <input id="login-username" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Senha</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-submit">Entrar</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </main>
  </div>

  <div id="app-screen" class="screen" hidden>
    <div class="page-shell">
      <header class="page-header">
        <div>
          <h1>Lojas</h1>
          <p class="desc">Todas as lojas cadastradas na plataforma.</p>
        </div>
        <div class="header-actions">
          <span id="admin-username" class="admin-username"></span>
          <button id="lixeira-btn" type="button" class="btn-secondary btn-sm">Lixeira</button>
          <button id="logout-btn" type="button" class="btn-secondary btn-sm">Sair</button>
        </div>
      </header>
      <main>
        <div class="table-wrap">
          <table id="tenants-table">
            <thead>
              <tr>
                <th>Loja</th>
                <th>Slug</th>
                <th>CNPJ</th>
                <th>Status</th>
                <th>Vencimento</th>
                <th>Criada em</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tenants-body"></tbody>
          </table>
        </div>
        <p id="empty-state" class="table-empty" hidden>Nenhuma loja cadastrada ainda.</p>
      </main>
    </div>
  </div>

  <template id="tenant-row-template">
    <tr>
      <td class="tenant-name"></td>
      <td class="tenant-slug"></td>
      <td class="tenant-cnpj"></td>
      <td>
        <select class="tenant-status"></select>
      </td>
      <td>
        <input type="date" class="tenant-expires">
      </td>
      <td class="tenant-created"></td>
      <td class="tenant-actions">
        <button type="button" class="save-btn">Salvar</button>
        <button type="button" class="delete-btn">Excluir</button>
      </td>
    </tr>
  </template>

  <script src="admin.js"></script>
</body>
</html>
