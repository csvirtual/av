<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDV - C&amp;S Virtual</title>
<link rel="icon" href="../icons/icon32.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="root">
    <div class="boot-loading">Carregando…</div>
  </div>
  <!-- Botão "voltar ao topo": fora de #root de propósito, então sobrevive
       a QUALQUER root.innerHTML ser reescrito (login, cadastro inicial,
       tela de aba bloqueada, app normal, troca de rota...) — funciona em
       qualquer página que role, não só dentro do app já logado. Ver
       js/app.js pela ligação com o scroll (feita uma única vez, fora de
       renderShell) e css/styles.css pelo estilo. -->
  <button class="scroll-top-btn" id="scroll-top-btn" type="button" tabindex="-1" aria-label="Voltar ao topo" title="Voltar ao topo">
    <svg viewBox="0 0 20 20" width="20" height="20" fill="none" aria-hidden="true" focusable="false">
      <path d="M10 14.5V5.5M10 5.5L5 10.5M10 5.5L15 10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <script type="module" src="js/app.js"></script>
</body>
</html>
