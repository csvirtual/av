<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Windows 11 — Área de Trabalho</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#0f3057">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Win11 Web">
</head>
<body>

<!-- Tela de boot -->
<div id="boot-screen" class="screen">
  <div class="boot-logo">⊞</div>
  <div class="boot-spinner"></div>
</div>

<!-- Tela de configuração inicial de senha -->
<div id="setup-screen" class="screen hidden">
  <div class="auth-card">
    <div class="auth-avatar" id="setup-avatar"></div>
    <h1>Bem-vindo</h1>
    <p class="auth-sub">Crie uma senha para proteger sua área de trabalho.</p>
    <form id="setup-form" autocomplete="off">
      <input type="text" id="setup-name" placeholder="Seu nome" maxlength="40" required>
      <input type="password" id="setup-pass" placeholder="Nova senha" minlength="4" required>
      <input type="password" id="setup-pass2" placeholder="Confirmar senha" minlength="4" required>
      <input type="text" id="setup-hint" placeholder="Dica de senha (opcional)" maxlength="80">
      <p id="setup-error" class="auth-error hidden"></p>
      <button type="submit" class="auth-btn">Criar senha →</button>
    </form>
  </div>
</div>

<!-- Tela de bloqueio / login -->
<div id="lock-screen" class="screen hidden">
  <div class="lock-clock">
    <div class="lock-time" id="lock-time">00:00</div>
    <div class="lock-date" id="lock-date">segunda-feira, 1 de janeiro</div>
  </div>
  <div class="auth-card">
    <div class="auth-avatar" id="lock-avatar"></div>
    <h1 id="lock-username">Usuário</h1>
    <form id="lock-form" autocomplete="off">
      <input type="password" id="lock-pass" placeholder="Senha" required>
      <p id="lock-error" class="auth-error hidden">Senha incorreta. Tente novamente.</p>
      <button type="submit" class="auth-btn">Entrar →</button>
      <button type="button" id="lock-hint-btn" class="auth-link">Esqueci minha senha</button>
    </form>
  </div>
</div>

<!-- Área de trabalho -->
<div id="desktop" class="screen hidden">
  <div id="wallpaper"></div>
  <div id="desktop-icons"></div>
  <div id="windows-layer"></div>

  <!-- Menu Iniciar -->
  <div id="start-menu" class="panel hidden">
    <input type="text" id="start-search" placeholder="Pesquisar" autocomplete="off">
    <div class="start-section-label">Fixados</div>
    <div id="start-pinned" class="start-grid"></div>
    <div class="start-footer">
      <button class="start-user" id="start-user-btn">
        <span class="avatar-sm" id="start-avatar"></span>
        <span id="start-username">Usuário</span>
      </button>
      <button id="start-power" class="icon-btn" title="Energia">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 3v8"></path>
          <path d="M6.5 6.5a7 7 0 1 0 11 0"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Menu da conta (bloquear / sair) -->
  <div id="account-menu" class="panel small hidden">
    <button data-action="lock">🔒 Bloquear</button>
    <button data-action="signout">🚪 Sair</button>
  </div>

  <!-- Menu de energia -->
  <div id="power-menu" class="panel small hidden">
    <button data-action="sleep">🌙 Suspender</button>
    <button data-action="restart">↻ Reiniciar</button>
    <button data-action="shutdown">⏻ Desligar</button>
  </div>

  <!-- Menu de volume -->
  <div id="volume-menu" class="panel small volume-panel hidden">
    <button id="volume-mute-btn" class="icon-btn" title="Mudo"></button>
    <input type="range" id="volume-slider" min="0" max="100" value="70">
    <span id="volume-value">70</span>
  </div>

  <!-- Menu de contexto -->
  <div id="context-menu" class="panel small hidden"></div>

  <!-- Barra de tarefas -->
  <div id="taskbar">
    <button id="start-btn" class="taskbar-btn" title="Iniciar">⊞</button>
    <button class="taskbar-btn" data-app="explorer" title="Explorador de Arquivos">📁</button>
    <button class="taskbar-btn" data-app="browser" title="Navegador">🌐</button>
    <button class="taskbar-btn" data-app="notepad" title="Bloco de Notas">📝</button>
    <button class="taskbar-btn" data-app="settings" title="Configurações">⚙️</button>
    <div id="taskbar-running" class="taskbar-running"></div>
    <div id="tray" class="tray">
      <button id="tray-volume-btn" class="icon-btn" title="Volume">🔊</button>
      <span id="tray-clock" class="tray-clock"></span>
    </div>
  </div>
</div>

<!-- Tela de reinicialização -->
<div id="restart-screen" class="screen hidden restart-screen">
  <div class="boot-spinner"></div>
  <p class="boot-message">Reiniciando…</p>
</div>

<!-- Tela de desligamento -->
<div id="shutdown-screen" class="screen hidden shutdown-screen">
  <div id="shutdown-spinner" class="boot-spinner"></div>
  <p id="shutdown-message" class="boot-message hidden">O PC foi desligado.<br>Você já pode fechar esta janela.</p>
  <button id="power-on-btn" class="auth-btn hidden">Ligar</button>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
